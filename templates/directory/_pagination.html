{% if records_page.has_other_pages %}<nav class="directory-pagination" aria-label="Páginas del directorio"><span>Página {{ records_page.number }} de {{ records_page.paginator.num_pages }}</span><div>{% if records_page.has_previous %}<a class="button button-secondary button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ records_page.previous_page_number }}">Anterior</a>{% endif %}{% if records_page.has_next %}<a class="button button-secondary button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ records_page.next_page_number }}">Siguiente</a>{% endif %}</div></nav>{% endif %}
